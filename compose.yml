services:
  opensearch-node1:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.15.0}
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - cluster.routing.allocation.disk.threshold_enabled=false
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-LocalAdmin123!}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - opensearch-net
  opensearch-node2:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.15.0}
    container_name: opensearch-node2
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - cluster.routing.allocation.disk.threshold_enabled=false
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-LocalAdmin123!}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - opensearch-net

  opensearch-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: opensearch-mcp-http:latest
    container_name: opensearch-mcp
    environment:
      - OPENSEARCH_CLUSTERS_LOCAL_URL=https://opensearch-node1:9200
      - OPENSEARCH_CLUSTERS_LOCAL_USERNAME=admin
      - OPENSEARCH_CLUSTERS_LOCAL_PASSWORD=LocalAdmin123!
      - OPENSEARCH_CLUSTERS_LOCAL_SSL_VERIFICATION_DISABLED=true
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - opensearch-net
    depends_on:
      - opensearch-node1
      - opensearch-node2

networks:
  opensearch-net:
