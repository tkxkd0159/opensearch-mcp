spring:
  application:
    name: opensearch-mcp
  ai:
    mcp:
      server:
        name: o8h-mcp-server
        protocol: STREAMABLE

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: "*"

opensearch:
  clusters:
    - name: test
      host: localhost
      port: 9200
      scheme: https
      username: ${TEST_USER:admin}
      password: ${TEST_PW}
      ssl-verification-disabled: true
