spring:
  application:
    name: opensearch-mcp
  ai:
    mcp:
      server:
        name: o8h-mcp-server
        protocol: STREAMABLE

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    org.apache.tomcat.util.net.NioEndpoint: OFF

opensearch:
  write-enabled: true
